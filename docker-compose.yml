# ClickHouse + pipeline antifraude.
#
#   docker compose up -d                     # solo ClickHouse
#   docker compose run --rm pipeline         # pipeline completo, sin borrar nada (si está vacía, genera el dataset)
#   docker compose run --rm pipeline python main.py --desde-cero         # BORRA la base de datos y la regenera
#   docker compose run --rm pipeline python main.py --scoring            # lote nuevo + scoring
#
# El pipeline tiene el perfil "pipeline" para que "docker compose up" no lo lance.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9   # versión fija: la misma que k8s/clickhouse.yaml
    container_name: clickhouse-dev
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DB: fraude_pagos
    ports:
      - "8123:8123"   # HTTP (clickhouse-connect)
      - "9000:9000"   # nativo (clickhouse-driver / clickhouse-client)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:      # el pipeline y Airflow esperan a que responda
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pipeline:
    build: .
    image: fraude-pipeline:latest
    profiles: [pipeline]
    # Teams/Slack/correo (TEAMS_WEBHOOK_URL, SMTP_..., ver .env.example). "environment" tiene prioridad
    env_file:
      - path: .env
        required: false
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # lo que lee config.py (dentro de la red de Docker el host es el nombre del servicio)
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      # lo que generan los scripts queda en estas carpetas del proyecto
      - ./datos_ml:/app/datos_ml
      - ./modelos:/app/modelos
      - ./resultados:/app/resultados
      - ./historico:/app/historico

  # La web para el cliente (http://localhost:8000). Misma imagen que el pipeline; lee ClickHouse
  # y guarda las revisiones y los avisos leídos. Perfil propio para que "docker compose up -d" siga arrancando solo
  # la base de datos:   docker compose --profile web up -d --build
  web:
    build: .
    image: fraude-pipeline:latest
    profiles: [web]
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - ./resultados:/app/resultados:ro
    restart: unless-stopped

  # La web de los modelos (http://localhost:8001), solo para el administrador: misma imagen; lee los modelos, los
  # datos de test y los resultados que deja el pipeline, y ClickHouse solo para comprobar la sesión. Con el mismo perfil que la web de casos:
  #   docker compose --profile web up -d --build
  web-modelos:
    build: .
    image: fraude-pipeline:latest
    profiles: [web]
    command: ["uvicorn", "web_modelos.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:                 # para comprobar la sesión (la de la web de casos, web/sesiones.py)
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    ports:
      - "8001:8001"
    volumes:
      - ./modelos:/app/modelos:ro
      - ./datos_ml:/app/datos_ml:ro
      - ./resultados:/app/resultados:ro
    restart: unless-stopped

volumes:
  clickhouse_data:
