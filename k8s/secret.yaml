# Contraseña de ClickHouse. La misma que docker-compose.yml: SOLO para un clúster local.
# Fuera de local, crearla a mano y no versionarla:
#   kubectl -n fraude create secret generic clickhouse --from-literal=CLICKHOUSE_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse
  namespace: fraude
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: password
