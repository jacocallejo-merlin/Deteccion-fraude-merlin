# Scoring diario (igual que el DAG fraude_scoring): un lote nuevo de transacciones, ETL,
# scoring con los modelos guardados y validación (python main.py --scoring).
# Para lanzarlo a mano:  kubectl -n fraude create job --from=cronjob/fraude-scoring scoring-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fraude-scoring
  namespace: fraude
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid      # nunca dos a la vez (reconstruyen las mismas tablas)
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Sin reintentos: repetir main.py --scoring entero generaría OTRO día de datos. Si falla, el
      # scoring del día siguiente puntúa también lo que quedó pendiente (solo puntúa lo que falta)
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: fraude-pipeline
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000          # el usuario "fraude" de la imagen
            runAsGroup: 1000
          initContainers:
            # Crea las carpetas en el volumen con dueño "fraude" y espera a que ClickHouse responda
            - name: preparar
              image: busybox:1.36
              securityContext:
                runAsUser: 0
              command:
                - sh
                - -c
                - |
                  mkdir -p /v/datos_ml /v/modelos /v/resultados /v/historico
                  chown -R 1000:1000 /v
                  until wget -q -O- http://clickhouse:8123/ping; do echo "esperando a ClickHouse"; sleep 3; done
              volumeMounts:
                - name: artefactos
                  mountPath: /v
          containers:
            - name: pipeline
              image: fraude-pipeline
              imagePullPolicy: IfNotPresent
              command: ["python", "main.py", "--scoring"]
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: clickhouse
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {memory: 6Gi}
              volumeMounts:
                - {name: artefactos, mountPath: /app/datos_ml, subPath: datos_ml}
                - {name: artefactos, mountPath: /app/modelos, subPath: modelos}
                - {name: artefactos, mountPath: /app/resultados, subPath: resultados}
                - {name: artefactos, mountPath: /app/historico, subPath: historico}
          volumes:
            - name: artefactos
              persistentVolumeClaim:
                claimName: artefactos
