# EJEMPLO del Secret con los datos de Teams, Slack y correo (pipeline/notificar.py). NO está en
# kustomization.yaml ni se debe subir a Git con datos reales: es opcional (los Job y CronJob lo
# cargan con optional: true) y, si no existe, simplemente no se envían avisos.
#
# Lo más sencillo es crearlo a mano, sin fichero:
#   kubectl -n fraude create secret generic notificaciones \
#     --from-literal=TEAMS_WEBHOOK_URL=https://... \
#     --from-literal=SMTP_SERVIDOR=smtp.office365.com --from-literal=SMTP_USUARIO=... \
#     --from-literal=SMTP_PASSWORD=... --from-literal=CORREO_DESTINATARIOS=a@x.com,b@x.com
#
# O copiar este fichero fuera del repositorio, rellenarlo y: kubectl apply -f <copia>.yaml
# Deja vacío (o borra) lo que no uses. Para probarlo:
#   kubectl -n fraude create job --from=cronjob/fraude-scoring prueba-avisos   (o cualquier Job)
apiVersion: v1
kind: Secret
metadata:
  name: notificaciones
  namespace: fraude
type: Opaque
stringData:
  TEAMS_WEBHOOK_URL: ""
  SLACK_WEBHOOK_URL: ""
  SMTP_SERVIDOR: ""
  SMTP_PUERTO: "587"
  SMTP_USUARIO: ""
  SMTP_PASSWORD: ""
  CORREO_REMITENTE: ""
  CORREO_DESTINATARIOS: ""
