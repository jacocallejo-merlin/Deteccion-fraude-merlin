# Pipeline completo: con la base de datos vacía genera el dataset; después entrena los 5 modelos,
# puntúa, evalúa y valida (python main.py, que no borra nada). Es la primera ejecución tras
# "kubectl apply -k k8s/".
# Con generateName cada "kubectl create -f" crea un Job nuevo (no usar apply).
apiVersion: batch/v1
kind: Job
metadata:
  generateName: fraude-pipeline-completo-
  namespace: fraude
  labels:
    app: fraude-pipeline
spec:
  backoffLimit: 1                # si falla se repite una vez (main.py genera lo que falte y rehace el resto)
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: fraude-pipeline
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000          # el usuario "fraude" de la imagen
        runAsGroup: 1000
      initContainers:
        # Crea las carpetas en el volumen con dueño "fraude" y espera a que ClickHouse responda
        - name: preparar
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /v/datos_ml /v/modelos /v/resultados /v/historico
              chown -R 1000:1000 /v
              until wget -q -O- http://clickhouse:8123/ping; do echo "esperando a ClickHouse"; sleep 3; done
          volumeMounts:
            - name: artefactos
              mountPath: /v
      containers:
        - name: pipeline
          image: fraude-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "main.py"]
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: clickhouse
            # Teams/Slack/correo (k8s/secret-notificaciones.ejemplo.yaml). Opcional: sin él no se avisa
            - secretRef:
                name: notificaciones
                optional: true
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: artefactos, mountPath: /app/datos_ml, subPath: datos_ml}
            - {name: artefactos, mountPath: /app/modelos, subPath: modelos}
            - {name: artefactos, mountPath: /app/resultados, subPath: resultados}
            - {name: artefactos, mountPath: /app/historico, subPath: historico}
      volumes:
        - name: artefactos
          persistentVolumeClaim:
            claimName: artefactos
