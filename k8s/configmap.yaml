# Lo que lee config.py (tiene prioridad sobre config.yaml). Dentro del clúster ClickHouse
# se llama por el nombre de su Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: fraude
data:
